# 钢铁全流程案例包（开发集）的期望识别结果，用于 ./dev.ps1 eval 计算准确率与召回率（Python 标准库 tomllib 读取）。
# 本文件写于任何模型运行之前，只依据 samples/steel-industry 的 11 份资料原文，未参考任何模型输出。
# 本案例包是开发集：可用于调试识别效果，结论不作为留出评测的依据。
# 资料序号：01 转炉炼钢、02 炉外精炼、03 板坯连铸与切割、04 热轧、05 冷轧、06 取样与检验、07 质量判定与处置、
# 08 库区与发运、09 订单与生产计划、10 生产与质量记录台账（表名即工作表名）、11 编码与代码规则手册。
#
# 匹配规则：模型给出的中文名、英文名或任一同义词，规范化（去空白、全角转半角、小写）后
# 与 names 中任一项相同即算命中。
# core = true 的项计入召回率；core = false 为可接受项：识别出来不算错，没识别出来也不扣召回。
# 关系不计较方向与名称：A→B 与 B→A 都算命中。domain、range 用对应对象类型 names 的第一个名字。
# 属性按 domain（对象类型主名）+ 属性名匹配；层级为子类 → 父类，方向要对。
#
# 收录标准（参照钢铁冶金、设备维修案例包，换成钢铁全流程的说法）。对象类型收录以下几类，依据都要在资料原文里找得到：
#   1. 有标识的事物：原文给出编号或编码规则（炉次号、浇次号、板坯号、热轧卷号、冷轧段卷号、包装件号、
#      样品号、检验批号、质量处置单号、质量证明书号、销售订单号、订单行号、生产订单号、发运单号、
#      内部钢种编码、设备编号、天车编号、库区代码、库位号、切割计划号、执行记录号、分析记录号、
#      判定记录号、移库指令号、事件记录号等，见 11 编码结构与 10 各表首列）。
#   2. 原文逐个记录数据的记录或事件：原文写明对每一次记录时刻、实测值、结果，或称为“一次……”“……记录”
#      “……实绩”（炼钢的测温测氧、精炼的一次处理、连铸的切割实绩、热轧与冷轧的工序实绩、取样检验的
#      化学分析与检验结果、质量判定记录、库区的移动事件、发运的装车与出厂事件）。
#   3. 钢在其中或其上被加工、盛装的生产设备，以及库区的天车：10 机组与库区表中有编号的机组；
#      设备内部的区段与部件（结晶器、真空槽、卷取机、精轧出口、入口计长点）不算。
#   4. 钢在各工序的实物形态，且原文记录了它的编号或测量值（板坯、热轧卷、冷硬卷、退火卷、镀锌卷、包装件；
#      钢水、带钢作为可接受项）。
#   5. 原文写明由哪些有标识的事物组成的计划或单据（切割计划列浇次、流号与生产订单；生产订单列订单行；
#      发运单列包装件、钢卷与证明书；检验批有成员清单）。
# 不收录：工艺步骤与操作（开炉、吹炼、终点、出钢、接钢、送样、收样、制样、接浇、换钢种、开浇、切割、
#   二次切割作业本身、粗精轧、卷取、酸洗冷轧、退火、镀锌、焊接接带、合卷、包装、称量作业、组批、判定、
#   封闭、放行、改判、让步、返修、报废、吊起、落位、装车、出厂等，其数据记在别的对象上）；
#   状态与取值（样品类型 ENDPOINT/REFINING/TUNDISH/PRODUCT/MECHANICAL/COATING 及转炉终点样、精炼工位样、
#   判定样、中间包样、成品样、力学性能样、镀层试样等样别；判定结果 CONFORM/NONCONFORM/PENDING；
#   处置类型 RELEASE/HOLD/DEGRADE/REASSIGN/CONCESSION/REWORK/SCRAP；来源证据等级、份额基准、采集方式、
#   检验文件类型 T21–T32、镀层类型 GI/GA、移动事件代码 LIFT/RELEASE/LOAD/DISPATCH、化学元素代码；
#   过渡坯、普通坯、头坯、尾坯、原坯、新坯、母卷、子卷这类角色或位置叫法）；
#   只作为执行者或交接对象出现的人员、部门与单位（炉长、主控记录员、取样员、送样员、收样员、化验审核人、
#   调度、台席、接钢人、分流跟踪员、切割员、编号员、称量员、质量员、质量工程师、判定员、授权批准人、
#   计划员、接单员、跟单员、库管员、保管员、理货员、发运员、门岗；化验室、检验室、各部门；
#   客户、订货方、收货方）；没有自身数据的设备部位与辅助物（结晶器、真空槽、卷取机、钢包回转台、样袋、
#   焊缝与接头、包装材料）；交接用的纸联、回执与标签（随钢卡、随炉单、交接单、交送联、送样联、收样联、
#   随行联、接收联、凭条、卷牌、包牌、样签、卷卡、来料卡、派工条、交班簿、值班本、配料清单、备料清册、
#   拣货单、装车清单、提货单）；参考表与代码表本身（机组类型、钢种与订货牌号对照、方法与文件目录、
#   编码结构及 11 的各代码表）；只在一处出现、没有自身数据的计划与安排（轧制安排、检验计划、派车安排）；
#   重卷机组 RCL1、包装机组 PCK1 只在机组清单出现，不单列（可归入设备）。
#   分卷区段卡的起止长度在 10 冷轧卷表记在子卷（冷硬卷）行上，按冷硬卷的属性处理；10 让步适用范围表是
