# 钢铁冶金样例资料的期望识别结果，用于 ./dev.ps1 eval 计算准确率与召回率（Python 标准库 tomllib 读取）。
# 匹配规则：模型给出的中文名、英文名或任一同义词，规范化（去空白、全角转半角、小写）后
# 与 names 中任一项相同即算命中。
# core = true 的项计入召回率；core = false 为可接受项：识别出来不算错，没识别出来也不扣召回。
# 关系不计较方向与名称：A→B 与 B→A 都算命中。domain、range 用对应对象类型 names 的第一个名字。
#
# 收录标准（#7 定）。对象类型收录以下几类，依据都要在样例资料原文里找得到：
#   1. 有标识的事物：原文给出编号（炉号、包号、板坯号、钢卷号、检验批号等）。
#   2. 原文逐个记录数据的事物或记录：原文写明对每一个记录测量值、时间、结果，或把每次发生
#      称为“一次……”“一份……”“……记录”。
#   3. 钢在其中或其上被加工、盛装的生产设备（与转炉、加热炉同类）。
#   4. 钢在各工序的物料形态，且原文记录了它的测量值（钢水、铸坯、中间坯、带钢）。
# 不收录：工艺步骤与操作（装料、吹炼、出钢、切割、开浇、停浇、连浇、修磨、粗轧、精轧、
#   层流冷却、卷取、回炉等，其数据在原文里记在别的对象上）；判定结果、状态与取值（判废、
#   改判钢种、异常坯）；只作为执行者出现的人员与部门（质检员、质量部门）；没有自身数据的
#   设备部位与辅助设备（二冷区、钢包回转台、行车、表面检测仪）；没有自身数据的投入物料
#   （铁水、废钢、脱氧合金）。拿不准的不收（例如精整线、订单、中间包测温、出钢）。
# 同一事物在原文里的全称或别称并入同一项的 names（如“顶底复吹转炉”“板坯连铸机”“成品化学成分要求”）。
# 关系收录两端都在本清单里、且原文有一行（一句或几句、列表项、表格行）直接写明两者联系的；
# 只在定义某个属性时顺带出现的两者（如“拉速：铸坯从结晶器拉出的速度”）不收。

