# 设备点检与维修案例包（开发集）的期望识别结果，用于 ./dev.ps1 eval 计算准确率与召回率（Python 标准库 tomllib 读取）。
# 本文件写于任何模型运行之前，只依据 samples/maintenance 的 6 份资料原文，未参考任何模型输出。
# 本案例包是开发集：可用于调试识别效果，结论不作为留出评测的依据。
#
# 匹配规则：模型给出的中文名、英文名或任一同义词，规范化（去空白、全角转半角、小写）后
# 与 names 中任一项相同即算命中。
# core = true 的项计入召回率；core = false 为可接受项：识别出来不算错，没识别出来也不扣召回。
# 关系不计较方向与名称：A→B 与 B→A 都算命中。domain、range 用对应对象类型 names 的第一个名字。
# 属性按 domain（对象类型主名）+ 属性名匹配；层级为子类 → 父类。
#
# 收录标准（参照钢铁冶金案例包，换成本领域说法）。对象类型收录以下几类，依据都要在资料原文里找得到：
#   1. 有标识的事物：原文给出编号（设备编号、标准编号、路线编号、记录号、工单号、报修单编号、
#      备件编码、领用单号、供应商编号、计划编号、油品编码、计量器具编号、检验报告编号、证书编号等）。
#   2. 原文逐个记录数据的记录或事件：原文写明对每一次记录日期、结果、实测值，或称为“一条……记录”
#      “一张……单”（点检记录、润滑记录、领用单、退库单）。
#   3. 设备与备件、油品、计量器具等实物：设备台账中有设备编号的单台设备；设备上的部位与部件
#      （主轴、液压站、辐射管、润滑点、点检部位）不算，除非原文另给它编号和数据。
#   4. 原文写明由哪些有标识事物组成的计划或单据（点检计划“每一条计划行对应一台设备的一个点检项目”，
#      保养计划“每一行写明设备编号”）。
# 不收录：点检、保养、润滑、派工、验收、外委、复查等作业步骤（其数据记在点检记录、维修工单等对象上）；
#   状态与取值（点检分级、点检结果、工单类型、工单来源、紧急程度、工单状态、保养等级、设备等级、
#   备件重要性与专业分类、校准状态标识、检验结论）；只作为执行者出现的人员与部门（操作者、班组长、
#   维修班、设备工程师、设备责任人、维修负责人、计量室、检验机构、车间）；没有自身数据的部位与部件
#   （点检部位、点检项目、润滑点、安全附件）；按类别给出的参考表（三级点检对照、类别代码表、
#   考核指标表、关键备件清单本身）；KPI 与统计表（MTBF、MTTR、返修率）。
# 拿不准的一律 core = false（例如润滑标准、使用登记证、外委维修合同、故障分析报告、
#   测点、点检员、日点检任务、特种设备的三个类别）。
# 同一事物在原文里逐字出现的全称或别称并入同一项的 names（机台＝设备；点检基准书＝点检标准；
# 工单、维修单＝维修工单；故障报修单＝报修单；备品备件、配件＝备件；PM计划、保养计划、月度预防性维护计划＝预防性维护计划）。
# “设备台账”原文定义为每台设备一条记录的设备主数据，并入设备；“设备档案”也并入设备：01 §4.2 写明
# “设备台账和设备档案是同一张设备主数据的两种视图”，“设备档案”即指设备台账中该台设备的记录及其附件
# （#58 修订，原先单列为可接受项）。
# #58 补充的可接受项：外委维修报告（02 §12.3 写明每份报告记故障原因、更换的部件和测试数据，作为
# 对应维修工单的附件）。
# 关系收录两端都符合上述标准、且原文一句话、列表项或表格行直接写明两者联系的；表格列里记录另一事物
# 的编号（所用备件编码、来源单据号、关联工单号、标准编号、适用设备、供应商编号）算写明联系。

