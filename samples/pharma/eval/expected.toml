# 药品批生产（片剂）留出案例包的期望识别结果，用于 ./dev.ps1 eval 计算准确率与召回率（Python 标准库 tomllib 读取）。
# 本文件是留出集答案：写于任何模型在本案例包上运行之前，只依据 6 份资料原文（工艺规程、批生产记录管理规程、
# 物料接收取样与检验规程、偏差与CAPA管理规程、设备与洁净区台账、成品检验与放行规程），没有参考识别代码、
# 提示词或任何模型输出。
#
# 匹配规则：模型给出的中文名、英文名或任一同义词，规范化（去空白、全角转半角、小写）后与 names 中任一项相同即算命中。
# core = true 的项计入召回率；core = false 为可接受项：识别出来不算错，没识别出来也不扣召回。
# 关系不计较方向与名称：A→B 与 B→A 都算命中。domain、range 用对应对象类型 names 的第一个名字。
# 层级（hierarchy）是子类 → 父类，方向要对。
#
# 收录标准（参照钢铁案例包的标准，改写成药品批生产的说法）。对象类型收录以下几类，依据都要在资料原文里找得到：
#   1. 有标识的事物：原文给出编号（批号、物料批号、设备编号、房间编号、器具编号、偏差编号、CAPA编号、
#      请验单编号、检验报告单编号、放行单编号、留样编号、考察编号等）。
#   2. 原文逐个记录数据的记录或事件：原文写明对每一个记录测量值、时间、结果，或称为“……记录”“每次……填写”
#      （设备清洁记录、称量配料记录、压片中间控制记录、发运记录等）。
#   3. 物料在其中被加工、盛装的生产设备：设备台账里能单独运行的设备；设备内部部件（冲模、滤袋）不算核心。
#      台账统一按“设备”建模即可，具体设备类别（压片机、流化床干燥机等）作为可接受项。
#   4. 物料在各工序的形态，且原文记录了它的测量值（总混颗粒、素片、包衣片）。
#   5. 原文写明由哪些有标识的事物组成的单据（批生产记录由各工序表单组成、清场合格证编号由房间编号和批号组成）。
#      关键工艺参数表、成品检验项目与标准规定这类按工序或产品给出的参考表不算核心。
# 不收录：工艺步骤与操作（称量配料、湿法制粒、干燥、整粒、总混、压片、包衣、内包装、外包装、清场、取样、
#   请验、复验、放行操作等，其数据在原文里记在别的对象上；“工序”这一概念作为可接受项）；状态与取值
#   （待验/合格/不合格、在用/停用、偏差等级微小/主要/重大、根本原因类别、审核结论合格/不合格/待定、
#   供应商评价A/B/C、清洁类型）；只作为执行者出现的人员与部门（质量受权人、QA、QC、中控员、班组长、
#   物料部、设备工程部等）；没有自身数据的部件与公用系统（滤袋、冲头、纯化水系统、空调净化系统）；
#   只出现一次、没有自身数据的单据与台账（偏差台账、CAPA台账、留样台账、销毁记录、销售订单、送货单）；
#   标签（称量标签、中间产品标签、已取样标签、箱签）。
# 拿不准的处理：拿不准是不是对象类型、但建了也说得过去的，以 core = false 收入；拿不准是否“一定会建”的按 false。
# 同一事物在原文里逐字出现的全称、简称或别称并入同一项的 names（如“批生产记录/批记录/BPR”“素片/片芯”
# “总混颗粒/待压颗粒”“请验单/检验申请单”“供应商/供货单位”“物料批号/接收编号”）。
# 名字相近但原文区分的不合并：检验报告单（本公司 QC 对物料出具，JC-年月-流水号）、供应商检验报告书（COA，
# 只作参考）、成品检验报告书（JC-CP-批号）、中间产品检验报告单是四种东西；物料放行单与成品放行单是两种东西；
# 请验单（物料）、中间产品请验单、成品请验单是三种东西。
# 关系收录两端都是本文件里的对象类型、且原文有一句话、一个列表项或一个表格行直接写明两者联系的；表格列里记录
# 另一事物的编号（设备台账的“所在房间编号”、清洁记录的“上一批号”）算写明联系。每条关系后注明原文依据。
# 属性收录原文写明对该类型记录的数据项；数据项若是另一对象类型的编号（如清洁记录里的“设备编号”），按关系处理。

