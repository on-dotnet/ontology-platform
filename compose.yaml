# 开发与测试用的容器编排。统一经 ./dev.ps1 调用，不要直接 docker compose down -v。
# 本项目构建的镜像带工作区标签 OP_IMAGE_TAG（由 dev.ps1 按所在目录算出），
# 几个 git worktree 同时构建、测试时各用各的镜像。
name: ontology

x-build-args: &build-args
  PIP_INDEX_URL: ${OP_PIP_INDEX_URL:-https://pypi.org/simple}
  PYPI_FILES_MIRROR: ${OP_PYPI_FILES_MIRROR:-}
  NPM_REGISTRY: ${OP_NPM_REGISTRY:-https://registry.npmjs.org}

x-api-env: &api-env
  OP_ENV: ${OP_ENV:-development}
  OP_DATABASE_URL: postgresql+psycopg://ontology:${OP_POSTGRES_PASSWORD:-ontology-dev-only}@postgres:5432/ontology
  OP_SECRET_KEY: ${OP_SECRET_KEY:-dev-only-secret-change-me}
  OP_ADMIN_USERNAME: ${OP_ADMIN_USERNAME:-admin}
  OP_ADMIN_PASSWORD: ${OP_ADMIN_PASSWORD:-admin12345}
  # Empty means "follow OP_ENV": Secure cookies in production, plain in development.
  OP_COOKIE_SECURE: ${OP_COOKIE_SECURE:-}
  # Model access; values come from .env.local (see .env.example). Empty key = AI not configured.
  OP_OPENAI_API_KEY: ${OP_OPENAI_API_KEY:-}
  OP_AI_PROXY: ${OP_AI_PROXY:-}
  OP_AI_BASE_URL: ${OP_AI_BASE_URL:-}
  OP_AI_MODEL: ${OP_AI_MODEL:-}
  OP_AI_REASONING_MODEL: ${OP_AI_REASONING_MODEL:-}
  # Reasoning effort: OP_AI_EFFORT for resolve and relations; OP_AI_REASONING_EFFORT for types.
  # "default" sends none (for compatible services without the parameter).
  OP_AI_EFFORT: ${OP_AI_EFFORT:-}
  OP_AI_REASONING_EFFORT: ${OP_AI_REASONING_EFFORT:-}
  # Concurrency: jobs a worker runs at once (default 3, 1-8) and model calls a process makes at
  # once (default 4), the batches of one document and different documents together.
  OP_WORKER_CONCURRENCY: ${OP_WORKER_CONCURRENCY:-}
  OP_AI_MAX_CONCURRENT_CALLS: ${OP_AI_MAX_CONCURRENT_CALLS:-}
  OP_DOCUMENTS_DIR: /data/documents
  # single (default): reviewers merge their own changes; separate: another reviewer decides.
  OP_REVIEW_MODE: ${OP_REVIEW_MODE:-}
  # External data sources (M3). Empty values mean the defaults in settings.py.
  # Earlier OP_SECRET_KEY values while credentials are re-encrypted (key rotation).
  OP_SECRET_KEY_PREVIOUS: ${OP_SECRET_KEY_PREVIOUS:-}
  OP_QUERY_TIMEOUT_SECONDS: ${OP_QUERY_TIMEOUT_SECONDS:-}
  OP_QUERY_MAX_ROWS: ${OP_QUERY_MAX_ROWS:-}
  OP_MCP_ALLOWED_ORIGINS: ${OP_MCP_ALLOWED_ORIGINS:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    environment:
      POSTGRES_DB: ontology
      POSTGRES_USER: ontology
      POSTGRES_PASSWORD: ${OP_POSTGRES_PASSWORD:-ontology-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontology -d ontology"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
      args: *build-args
    image: ontology/api:${OP_IMAGE_TAG:-local}
    environment:
      <<: *api-env
      # The api is reachable only through the web container's nginx, which overwrites X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - documents-data:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    image: ontology/api:${OP_IMAGE_TAG:-local}
    command: ["python", "-m", "ontology_platform.worker"]
    environment: *api-env
    volumes:
      - documents-data:/data/documents
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      target: runtime
      args: *build-args
    image: ontology/web:${OP_IMAGE_TAG:-local}
    ports:
      - "${OP_WEB_PORT:-28080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 以下为工具容器，只在 ./dev.ps1 test-* 时临时运行
  test-api:
    profiles: [tools]
    build:
      context: ./backend
      target: test
      args: *build-args
    image: ontology/test-api:${OP_IMAGE_TAG:-local}
    environment:
      OP_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://ontology:${OP_POSTGRES_PASSWORD:-ontology-dev-only}@postgres:5432/postgres
      # pytest-xdist workers for the full run in scripts/check.sh; empty = its default.
      OP_TEST_WORKERS: ${OP_TEST_WORKERS:-}
    depends_on:
      postgres:
        condition: service_healthy

  test-web:
    profiles: [tools]
    build:
      context: ./web
      target: test
      args: *build-args
    image: ontology/test-web:${OP_IMAGE_TAG:-local}

  # Built here, but run by ./dev.ps1 e2e with docker run on a throwaway network of its own,
  # never against the dev stack.
  test-e2e:
    profiles: [tools]
    build:
      context: ./web
      target: e2e
      args: *build-args
    image: ontology/test-e2e:${OP_IMAGE_TAG:-local}

volumes:
  postgres-data:
  documents-data:
