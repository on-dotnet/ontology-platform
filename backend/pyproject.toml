[project]
name = "ontology-platform"
version = "0.1.0"
description = "Backend of the AI native ontology platform."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "annotated-types>=0.7",
    "argon2-cffi>=25.1",
    "fastapi>=0.120",
    "httpx2>=2.16",
    "openai>=3.57",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "rdflib>=7.1",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.17",
    # SHACL validation of exported shapes in the tests (Apache-2.0).
    "pyshacl>=0.30",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    # Runs the full suite across processes, each with its own test database (MIT).
    "pytest-xdist>=3.8",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

# Lock against the official index; mirrors are only used to install uv itself.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "B",
    "UP",
    "SIM",
    "S",
    "C4",
    "PT",
    "DTZ",
    "ASYNC",
    "FAST",
    "RUF",
]
# Chinese domain text uses full-width punctuation, which RUF001-003 would flag as confusable.
allowed-confusables = ["，", "：", "；", "（", "）", "！", "？", "｜"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
