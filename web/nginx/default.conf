# Static SPA + reverse proxy for /api. Included in the http block; listens on 8080 as a non-root user.

# Sign-in attempts per client IP: 10 per minute, short bursts of 5 allowed.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# MCP calls (spec 003, 9.3): 120 per minute per client IP and per Authorization header, so that
# requests without a token or with made-up ones are limited too.
limit_req_zone $binary_remote_addr zone=mcp_ip:10m rate=120r/m;
limit_req_zone $http_authorization zone=mcp_token:10m rate=120r/m;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Request bodies are small except document uploads (20 MB per file, see the /api/documents location).
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/problem+json application/xml image/svg+xml;

  # Docker's embedded DNS; resolving at request time lets nginx start before the api container exists.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @login_rate_limited;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  location @login_rate_limited {
    default_type application/problem+json;
    include /etc/nginx/snippets/headers-api.conf;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many sign-in attempts.","code":"auth.rate_limited"}';
  }

  # Interactive API docs are not exposed through the web entry point (production disables them anyway).
  location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
    default_type application/problem+json;
    include /etc/nginx/snippets/headers-api.conf;
    return 404 '{"type":"about:blank","title":"Not Found","status":404,"code":"http.not_found"}';
  }

  # Document upload: 20 MB per file plus multipart overhead; only this path accepts large bodies.
  location = /api/documents {
    client_max_body_size 25m;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  location /api/ {
    include /etc/nginx/snippets/api-proxy.conf;
  }

  # The MCP endpoint for external agents; the api checks the access token.
  location = /mcp {
    limit_req zone=mcp_ip burst=20 nodelay;
    limit_req zone=mcp_token burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @mcp_rate_limited;
    include /etc/nginx/snippets/api-proxy.conf;
  }

  location @mcp_rate_limited {
    default_type application/problem+json;
    include /etc/nginx/snippets/headers-api.conf;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many MCP requests.","code":"mcp.rate_limited"}';
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed build output: cache for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/headers-app.conf;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/headers-app.conf;
  }

  # SPA fallback; unhashed files (favicon, theme-init.js) are revalidated on every load.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/headers-app.conf;
  }
}
