# Proxy settings shared by every /api location.
# A variable without a URI part forwards the original request URI unchanged.
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite, never append: the api trusts this header for audit IPs, so clients must not be able to forge it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_read_timeout 300s;
include /etc/nginx/snippets/headers-api.conf;
