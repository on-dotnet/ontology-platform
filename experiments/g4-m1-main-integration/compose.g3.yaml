name: ontology-g4-main-${G4_RUN_ID:?explicit current run required}
x-labels: &id001
  ontology.task-id: G4-M1-MAIN-INTEGRATION-001
  ontology.run-id: ${G4_RUN_ID:?explicit task run required}
  ontology.synthetic: 'true'
x-security:
  platform: linux/arm64
  pull_policy: never
  read_only: true
  security_opt: &id002
  - no-new-privileges:true
  cap_drop: &id003
  - ALL
  pids_limit: 256
  cpus: 2
  labels: *id001
services:
  platform-pg:
    ports:
    - "127.0.0.1:15432:5432"
    platform: linux/arm64
    pull_policy: never
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    pids_limit: 256
    cpus: 2
    labels: *id001
    image: postgres@sha256:9a74990a5c776ff210361b67616b347750c66c36ea0dfbb4f575d19fcc3d8437
    mem_limit: 768m
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    - DAC_OVERRIDE
    - FOWNER
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD_FILE: /run/secrets/platform-password
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - chown postgres:postgres /var/lib/postgresql; exec /usr/local/bin/docker-entrypoint.sh postgres -c log_statement=none
      -c log_min_error_statement=panic
    volumes:
    - platform-data:/var/lib/postgresql
    - ${G4_PRIVATE_DIR}/platform-password:/run/secrets/platform-password:ro
    tmpfs:
    - /tmp:size=16m,mode=1777
    - /var/run/postgresql:size=4m,mode=3775,uid=999,gid=999
    networks:
    - front
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U platform -d platform
      interval: 2s
      timeout: 2s
      retries: 30
  keycloak-test:
    ports:
    - "127.0.0.1:15180:8080"
    platform: linux/arm64
    pull_policy: never
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    pids_limit: 256
    cpus: 2
    labels: *id001
    image: quay.io/keycloak/keycloak@sha256:e1c1331f4a3e826016bdee2193335ed21685f0fd075c70bcb4d8fa7eeba9e1b4
    mem_limit: 1g
    user: ${G4_HOST_UID}:${G4_HOST_GID}
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - "runtime=/opt/keycloak/data/runtime\nif [ ! -f \"$$runtime/.recovery-built\" ]; then\n  mkdir -p \"$$runtime\"\n  for\
      \ item in bin conf lib providers themes LICENSE.txt README.md version.txt; do\n    if [ -e \"/opt/keycloak/$$item\"\
      \ ]; then cp -R \"/opt/keycloak/$$item\" \"$$runtime/\"; fi\n  done\n  chmod -R u+rwX \"$$runtime\"\n  \"$$runtime/bin/kc.sh\"\
      \ build --db=dev-file\n  touch \"$$runtime/.recovery-built\"\nfi\nexport KC_BOOTSTRAP_ADMIN_USERNAME=wave2-bootstrap\n\
      export KC_BOOTSTRAP_ADMIN_PASSWORD=\"$$(cat /run/secrets/keycloak-password)\"\nexec \"$$runtime/bin/kc.sh\" start --optimized\
      \ --http-enabled=true --http-port=8080 --hostname=http://localhost:15180 --hostname-strict=true --http-access-log-enabled=false\n"
    environment:
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
    - keycloak-data:/opt/keycloak/data
    - ${G4_PRIVATE_DIR}/keycloak-password:/run/secrets/keycloak-password:ro
    tmpfs:
    - /tmp:size=64m,mode=1777
    networks:
    - front
  api:
    ports:
    - "127.0.0.1:15100:15100"
    platform: linux/arm64
    pull_policy: never
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    pids_limit: 256
    cpus: 2
    labels: *id001
    image: mcr.microsoft.com/dotnet/aspnet@sha256:3a05e37c371f358d2b5cb9687d9992171b34b8c9146c283bef865bdbd2c53c55
    mem_limit: 1g
    user: ${G4_HOST_UID}:${G4_HOST_GID}
    working_dir: /private/api
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - while [ ! -f /private/api/appsettings.json ]; do sleep 1; done; exec dotnet /app/OntologyPlatform.Api.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:15100
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_EnableDiagnostics: '0'
    volumes:
    - ${G4_API_OUTPUT}:/app:ro
    - ${G4_PRIVATE_DIR}/api:/private/api:ro
    - api-keyring:/keyring
    tmpfs:
    - /tmp:size=64m,mode=1777
    networks:
    - front
  web:
    platform: linux/arm64
    pull_policy: never
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    pids_limit: 256
    cpus: 2
    labels: *id001
    image: node@sha256:a52166d89cfcc66ea62d10535ca712d161cece5d77ff4cfa758866b6b75ccb3f
    mem_limit: 256m
    user: ${G4_HOST_UID}:${G4_HOST_GID}
    network_mode: service:api
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - node /run/loopback-proxy.mjs
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      G4_ROOT: ${G4_ROOT}
      G4_RUN_ID: ${G4_RUN_ID}
      G4_GROUP: g3
    volumes:
    - ${G4_ROOT}/apps/web:${G4_ROOT}/apps/web:ro
    - ${G4_SHARED_WEB_MODULES}:${G4_SHARED_WEB_MODULES}:ro
    - ${G4_SHARED_ROOT_MODULES}:${G4_SHARED_ROOT_MODULES}:ro
    - ${G4_HELPERS}/loopback-proxy.mjs:/run/loopback-proxy.mjs:ro
    tmpfs:
    - /tmp:size=32m,mode=1777
  fuseki:
    ports:
    - "127.0.0.1:15303:3030"
    platform: linux/arm64
    pull_policy: never
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    pids_limit: 256
    cpus: 2
    labels: *id001
    image: sha256:715703f0cdb98680f3b71ebbfcdea126ec1ddc3f483f4341afde2cc63b1a817c
    mem_limit: 1g
    user: 10001:10001
    entrypoint:
    - java
    - -Xms128m
    - -Xmx640m
    - -Dlog4j.configurationFile=/opt/fuseki/g2-log4j2.properties
    - -jar
    - /opt/fuseki/fuseki-server.jar
    command:
    - --config=/opt/fuseki/g2-config.ttl
    volumes:
    - fuseki-data:/fuseki
    tmpfs:
    - /tmp:size=32m,mode=1777
    networks:
    - front
  rustfs:
    ports:
    - "127.0.0.1:15900:9000"
    platform: linux/arm64
    pull_policy: never
    read_only: true
    security_opt: *id002
    cap_drop: *id003
    pids_limit: 256
    cpus: 2
    labels: *id001
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    mem_limit: 768m
    user: ${G4_HOST_UID}:${G4_HOST_GID}
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - 'export RUSTFS_ACCESS_KEY="$$(cat /run/secrets/s3-access)"

      export RUSTFS_SECRET_KEY="$$(cat /run/secrets/s3-secret)"

      exec /usr/bin/rustfs /data

      '
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_OBS_LOG_DIRECTORY: /tmp/logs
    volumes:
    - rustfs-data:/data
    - ${G4_PRIVATE_DIR}/s3-access:/run/secrets/s3-access:ro
    - ${G4_PRIVATE_DIR}/s3-secret:/run/secrets/s3-secret:ro
    tmpfs:
    - /tmp:size=32m,mode=1777
    networks:
    - front
networks:
  front:
    internal: true
    labels: *id001
volumes:
  platform-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,mode=0700
    labels: *id001
  keycloak-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,mode=0700,uid=${G4_HOST_UID},gid=${G4_HOST_GID}
    labels: *id001
  api-keyring:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0700,uid=${G4_HOST_UID},gid=${G4_HOST_GID}
    labels: *id001
  fuseki-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,mode=0700,uid=10001,gid=10001
    labels: *id001
  rustfs-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,mode=0700,uid=${G4_HOST_UID},gid=${G4_HOST_GID}
    labels: *id001
