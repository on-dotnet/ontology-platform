name: Engineering baseline
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated verification parser
        shell: pwsh
        run: |
          python3 --version
          python3 -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --require-hashes --disable-pip-version-check --target .tools/pythonlibs -r scripts/verification-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repository policy and positive-negative checks
        shell: pwsh
        run: ./scripts/verify.ps1 -SelfTest
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore exact committed infrastructure graph
        shell: pwsh
        run: |
          dotnet restore backend/OntologyPlatform.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build format and real infrastructure host tests
        shell: pwsh
        run: ./scripts/verify.ps1 -RunNative -RunTests
      - name: Scope notice
        shell: pwsh
        run: Write-Output 'NOT_RUN - containers, business features, frontend and E2E are outside this CI job; local container evidence is recorded separately.'
