# 仅回环/隔离开发网络；无匿名访问、无默认秘密、无遥测外发。
[server]
http_port = 3000
root_url = http://localhost:15330
[users]
default_language = zh-Hans
allow_sign_up = false
[auth.anonymous]
enabled = false
[auth]
disable_login_form = false
[security]
disable_initial_admin_creation = false
cookie_samesite = lax
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[metrics]
enabled = true
[unified_alerting]
enabled = true
