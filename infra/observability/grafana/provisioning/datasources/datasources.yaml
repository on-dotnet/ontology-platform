apiVersion: 1
datasources:
  - name: 平台指标
    uid: platform-prometheus
    type: prometheus
    access: proxy
    url: $PROMETHEUS_URL
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
      exemplarTraceIdDestinations:
        - datasourceUid: platform-tempo
          name: trace_id
  - name: 平台日志
    uid: platform-loki
    type: loki
    access: proxy
    url: $LOKI_URL
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '^trace_?id$'
          matcherType: label
          datasourceUid: platform-tempo
          url: '$${__value.raw}'
  - name: 平台链路
    uid: platform-tempo
    type: tempo
    access: proxy
    url: $TEMPO_URL
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: platform-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: platform-prometheus
        tags:
          - key: service.name
            value: service_name
